<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in · Neko Rooms</title>
<style>
:root {
  color-scheme: dark;
  --background-secondary: #2f3136;
  --background-tertiary: #202225;
  --background-floating: #18191c;
  --text-normal: #dcddde;
  --style-primary: #19bd9c;
  --style-error: #d32f2f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  place-items: center;
  /* Native Neko's floating/80 login backdrop over the empty black viewer. */
  background: linear-gradient(#18191ccc, #18191ccc), #000;
  color: var(--text-normal);
  font: 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
}
main {
  width: min(320px, 100%);
  padding: 10px;
  border-radius: 5px;
  background: var(--background-secondary);
}
.brand { height: 90px; display: flex; align-items: center; justify-content: center; }
.brand svg { display: block; width: 90px; height: 90px; margin-right: 10px; flex: none; }
.brand h1 { margin: 0; font-size: 30px; line-height: 56px; font-weight: 400; }
.brand b { font-weight: 900; }
h2 { margin: 0; font-size: 14px; line-height: 30px; font-weight: 400; text-align: center; text-transform: uppercase; }
form { display: flex; flex-direction: column; }
label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
input, button { width: 100%; min-width: 0; margin: 5px 0; border: 0; border-radius: 5px; font: inherit; color: inherit; }
input { padding: 6px 8px; line-height: 20px; background: var(--background-tertiary); }
input::placeholder { color: #757575; opacity: 1; }
input::selection { background: #00b0f4; }
button { padding: 4px; line-height: 30px; font-weight: 700; text-align: center; text-transform: uppercase; background: var(--style-primary); cursor: pointer; }
:focus-visible { outline: 2px solid var(--style-primary); outline-offset: 0; }
button:focus-visible { outline-offset: 2px; }
.error { margin: 5px 0; padding: 8px; border-left: 3px solid var(--style-error); border-radius: 3px; background: var(--background-tertiary); line-height: 20px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main aria-labelledby="login-title">
<div class="brand">

<h2 id="login-title">neko-rooms · Owner sign in</h2>
{{if .Error}}<p class="error" id="login-error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="{{.Action}}" autocomplete="on">
<input type="hidden" name="next" value="{{.Next}}">
<label for="username">Username</label>
<input id="username" name="username" type="text" autocomplete="username" placeholder="Username" value="{{.Username}}" required autofocus{{if .Error}} aria-describedby="login-error"{{end}}>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required{{if .Error}} aria-describedby="login-error"{{end}}>
<button type="submit">Sign in</button>
</form>
</main>
