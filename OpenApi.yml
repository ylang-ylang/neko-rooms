openapi: 3.0.0
info:
  title: Neko Rooms
  version: 1.0.0
  description: |
    Management paths below are relative to admin.path_prefix (for example /manage).
    Configured local credentials use native HTML form login and an owner session by default:
    NEKO_ROOMS_ADMIN_AUTH_MODE=form (CLI --admin.auth_mode=form), with the existing
    NEKO_ROOMS_ADMIN_USERNAME and NEKO_ROOMS_ADMIN_PASSWORD. Explicit basic mode retains
    legacy HTTP Basic; admin.proxy_auth still takes precedence. With no credentials,
    intentionally unauthenticated management remains available. Partial credentials and
    unknown authentication modes are rejected at startup.

    Form-mode API requests without a valid session return 401, never a Basic challenge
    or login HTML. Unsafe management methods and login/logout require an Origin or
    Referer matching the request's scheme, host AND port; programmatic cookie-jar
    clients must supply Origin. Reverse-proxy HTTPS headers are trusted only with
    NEKO_ROOMS_PROXY=true. Owner sessions expire after seven days or manager restart,
    and cannot authenticate Agent CDP. Agent Bearer keys cannot manage rooms or keys.

    Room networking defaults to direct. NEKO_ROOMS_NETWORK_MODE=relay (CLI
    --network.mode=relay) requires Neko API v3 and operator-configured frontend
    RTCIceServers in NEKO_ROOMS_RELAY_ICE_SERVERS_FRONTEND (CLI
    --relay.ice_servers_frontend). Include authenticated turn: or turns: URLs and
    at least one TURN TCP or TLS listener; plain TURN/TCP is valid for local labs.
    Relay rooms publish no per-room media host ports. TURN relay allocations must
    remain on a private network reachable by the room containers. Internet clients
    connect to the configured fixed TURN listener, not to per-room media ports.
    Neko 3.2.0 requires a relay-only startup adapter to disable automatic public-IP
    discovery: it writes a nonsecret, world-readable native config in the container's
    temporary layer and execs the image's original startup argv. Explicit custom
    NEKO_CONFIG, mounted/inherited native config files, and image CLI overrides of
    managed Neko settings (including --config and WebRTC networking flags) are
    rejected in relay mode rather than silently replaced; direct mode is unchanged.
    Relay rooms default native NEKO_LOG_LEVEL to warn because pinned Neko logs TURN
    credentials at info/debug. An explicit per-room NEKO_LOG_LEVEL overrides this
    default; verbose credential-bearing logs are an operator opt-in.
    Config responses expose only the nonsecret network mode, never TURN credentials.
    Changing policy does not migrate or restart existing rooms: it affects new rooms
    and rooms explicitly recreated afterward. Legacy rooms without mode metadata are direct.

    NEKO_ROOMS_NETWORK_MODE=http (CLI --network.mode=http) selects Manager-owned
    HTTP/WSS aggregation for new or explicitly recreated API v3 rooms. No TURN
    configuration or room HostPortBindings is needed. The official Neko image and
    original startup argv are retained; the private startup adapter disables public
    IP retrieval and NAT rewriting. Native frontend ICE is []; one inert backend
    entry with no URLs suppresses Neko's automatic default-STUN fallback. Only
    private host candidates reach the per-viewer Pion receiver. VP8/Opus is remuxed
    into WebM, never transcoded or sent through public WebRTC. Native signaling WS
    is private in this mode. HTTP room URLs are relative and same-origin, ignoring
    a legacy LAN instance.url; other modes retain their existing URL behavior.
    Use NEKO_ROOMS_PROXY=true behind a trusted ordinary HTTP/WebSocket proxy, and
    leave NEKO_ROOMS_AGENT_PUBLIC_URL unset to infer Agent links from the request.

    Public viewer endpoints below are host-relative (not under admin.path_prefix).
    With path_prefix=/room, GET /room/{roomName}/ serves the owned aggregate.html;
    its compiled assets are public under /__aggregate/. Native room token sessions
    are a separate credential domain from Owner cookies and Agent Bearer keys.
    Login forwards real POST /api/login, logout forwards real POST /api/logout,
    and every stream validates real GET /api/whoami and identity-matched
    system/init. Native cookie mode is unsupported and fails visibly. There is
    no renewal endpoint. Tokens must never appear in URLs or be replaced with
    an API/admin synthetic session. Each token permits one live viewer connection;
    replacement waits for the old private control-release/normal-close cleanup.
servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/m1k1o/neko-rooms/1.0.0
security:
  - managerSession: []
  - managerBasicAuth: []
tags:
  - name: auth
    description: Public owner login and session endpoints
  - name: viewer
    description: Public native-room-authenticated HTTP/WebSocket aggregation
  - name: config
    description: config endpoints
  - name: rooms
    description: room endpoints
  - name: agent
    description: Temporary per-room Agent access, protected by native management authentication
paths:
  /room/{roomName}/__aggregate/login:
    post:
      tags: [viewer]
      operationId: aggregateRoomLogin
      summary: Sign in as a native Neko room viewer
      security: []
      parameters:
        - in: path
          name: roomName
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Native ephemeral token plus normalized member; original id/profile/state may be included. Cache-Control no-store; no Owner/native cookies are forwarded or set.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
                  member:
                    type: object
                    properties:
                      id: { type: string }
                      username: { type: string }
        '401': { description: Native room rejected the credentials }
        '403': { description: Foreign Origin or native login is forbidden }
        '422': { description: Native fixed identity is already connected }
        '502': { description: Native cookie mode unsupported or upstream invalid/unavailable }
  /room/{roomName}/__aggregate/logout:
    post:
      tags: [viewer]
      operationId: aggregateRoomLogout
      summary: Log out the matching native room viewer and close its connections
      security:
        - nativeRoomToken: []
      parameters:
        - in: path
          name: roomName
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Actual native POST /api/logout succeeded; only this viewer's streams are canceled.
          content:
            application/json:
              schema: { type: boolean, enum: [true] }
        '401': { description: Missing or invalid native room token }
        '403': { description: Foreign Origin or native logout is forbidden }
  /room/{roomName}/__aggregate/stream:
    get:
      tags: [viewer]
      operationId: aggregateRoomStream
      summary: Open the same-port authenticated viewer WebSocket
      security: []
      parameters:
        - in: path
          name: roomName
          required: true
          schema: { type: string }
      description: |
        Upgrade with same-origin ws/wss; no token, SDP or ICE in URL/query. The
        first text message within five seconds and 4096 bytes must be
        {type: auth, token: native-room-token}. Private resources are not opened
        before that message. After real whoami and matching native system/init,
        Manager sends {type: hello, mime: 'video/webm; codecs="vp8,opus"', width,
        height, member_id}, then raw binary WebM init and complete Clusters.
        Native control/host yields authoritative {type: state, controller_id,
        members}; screen changes terminate the old WebM epoch for reconnect.
        Cursor messages use type:cursor and action:position or image, with PNG
        base64 and hotspotX/hotspotY. Native input uses private ordered DC data,
        preserving the native IsHost check at delivery; public native signal/*
        and raw native envelopes are not accepted.
        Public input: control {action:request|release}; pointer
        {action:move|down|up|wheel,x,y,button,deltaX,deltaY}; key
        {action:down|up,key,code,repeat,altKey,ctrlKey,shiftKey,metaKey};
        clipboard {text}. DOM keys/buttons are converted to native X11 on Manager.
        Bounded media byte/time queues close slow viewers with 1013, discarding
        queued bytes and requiring a fresh init/keyframe on reconnect. Permission
        revocation/private mode/logout closes the stream and destroys public and
        private media state. Closing a viewer normally releases native control,
        closes native WS with 1000, and closes its private Pion connection.
      responses:
        '101': { description: WebSocket upgraded; this alone does not authenticate a viewer }
        '403': { description: Origin rejected }
  /auth/status:
    get:
      tags: [auth]
      summary: Read the effective management authentication mode and current login status
      operationId: managerAuthStatus
      security: []
      description: Always returns public JSON without a password, session token or Basic challenge.
      responses:
        '200':
          description: Authentication status (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAuthStatus'
  /auth/login:
    get:
      tags: [auth]
      summary: Display a password-manager-friendly native HTML login form
      operationId: managerLoginForm
      security: []
      parameters:
        - in: query
          name: next
          schema:
            type: string
          description: Optional local manager UI path; unsafe targets fall back to the manager root.
      responses:
        '200':
          description: Standard HTML form with username and current-password autocomplete fields; no JavaScript required.
          content:
            text/html:
              schema:
                type: string
        '303':
          description: Already logged in, redirect to manager root.
    post:
      tags: [auth]
      summary: Sign in using the existing configured owner credentials
      operationId: managerLogin
      security: []
      description: |
        Requires same-origin Origin or Referer. Ignores Authorization, including cached
        Basic credentials. Creates a new opaque server-side session and revokes the
        presented prior session. The host-only cookie is HttpOnly, SameSite=Lax and
        scoped to admin.path_prefix; Secure is enabled only for TLS or trusted proxy HTTPS.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                next:
                  type: string
                  description: Only a canonical local manager UI path, never API/auth or an external URL.
      responses:
        '303':
          description: Session cookie set; redirect to the safe next path or manager root.
        '400':
          description: Invalid or oversized form.
        '401':
          description: Ordinary HTML login error, without echoing the password or issuing a Basic challenge.
        '403':
          description: Missing or foreign Origin/Referer (including a different port on the same host).
        '404':
          description: Form login is not enabled in the current authentication mode.
        '415':
          description: Content-Type must be application/x-www-form-urlencoded.
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the owner session and clear its cookie
      operationId: managerLogout
      security: []
      description: |
        Requires same-origin Origin or Referer. Idempotent for expired or revoked sessions.
        Cached Basic credentials cannot silently restore a form-mode session after logout.
      responses:
        '303':
          description: Session revoked and cookie expired; redirect to the login form.
        '403':
          description: Missing or foreign Origin/Referer.
        '404':
          description: Form login is not enabled in the current authentication mode.
    get:
      tags: [auth]
      summary: GET cannot log out an owner
      operationId: managerLogoutGetRejected
      security: []
      responses:
        '405':
          description: Use POST; the session is unchanged.
  /api/config/rooms:
    get:
      tags:
        - config
      summary: Get rooms config
      description: Nonsecret room-creation policy and capacity. Does not include frontend ICE servers or TURN credentials.
      operationId: roomsConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsConfig'
        '500':
          description: Internal server error
  /api/agent/rooms/{roomName}/keys:
    parameters:
      - in: path
        name: roomName
        required: true
        description: Stable room name, URL-encoded as a single path segment (not container ID)
        schema:
          type: string
    post:
      tags:
        - agent
      summary: Create a temporary Agent key and its canonical handoff prompt
      description: |
        Relative to the management UI base, e.g. /manage/api/agent/rooms/{roomName}/keys.
        The raw key and prompt are returned only at issuance and must not be persisted by the client.
        Manager restart invalidates all temporary keys. No room or management passwords are included.
      operationId: agentKeyCreate
      security:
        - managerSession: []
        - managerBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentKeyCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAgentKey'
        '400':
          description: Invalid TTL or request
        '401':
          description: Management authentication required
        '404':
          description: Room not found
        '500':
          description: Internal server error
    get:
      tags:
        - agent
      summary: List active Agent keys for a room, without raw keys or prompts
      operationId: agentKeysList
      security:
        - managerSession: []
        - managerBasicAuth: []
      responses:
        '200':
          description: Active keys and current connection counts
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentKey'
        '401':
          description: Management authentication required
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/agent/rooms/{roomName}/keys/{keyId}:
    delete:
      tags:
        - agent
      summary: Revoke an Agent key and close its active sessions
      operationId: agentKeyRevoke
      security:
        - managerSession: []
        - managerBasicAuth: []
      parameters:
        - in: path
          name: roomName
          required: true
          description: Stable room name, URL-encoded as a single path segment
          schema:
            type: string
        - in: path
          name: keyId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Key revoked and all of its sessions closed
        '401':
          description: Management authentication required
        '404':
          description: Room or key not found
        '500':
          description: Internal server error
  /api/profiles:
    get:
      tags: [rooms]
      summary: List persistent browser profiles
      operationId: profilesList
      description: Ownership metadata only. Reconciles external container removal and adopts existing managed directories in place without restarting browsers.
      responses:
        '200':
          description: Durable named profiles, including available profiles retained after deployment removal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrowserProfile'
    post:
      tags: [rooms]
      summary: Create a persistent browser profile
      operationId: profileCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreateRequest'
      responses:
        '201':
          description: Available empty profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserProfile'
        '400':
          description: Invalid name or managed storage unavailable
  /api/profiles/{profileId}:
    delete:
      tags: [rooms]
      summary: Permanently delete an available profile and its data
      operationId: profileDelete
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Profile and data deleted by explicit Owner action
        '404':
          description: Profile not found
        '409':
          description: Profile is bound to a deployment; remove that deployment first, even if stopped
  /api/rooms:
    get:
      tags:
        - rooms
      summary: List all rooms
      operationId: roomsList
      parameters:
        - in: query
          name: labels
          schema:
            type: object
            additionalProperties: 
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomEntry'
        '500':
          description: Internal server error
    post:
      tags:
        - rooms
      summary: Create new room
      description: Creates a durable profile automatically when managed storage is enabled and profile_id is omitted. Existing profiles are exclusively bound until deployment removal; conflicting use returns 409 and unknown profile IDs return 404. Network/image/password/screen settings remain deployment-owned. Unsupported settings return 400; Docker failures remain 500.
      operationId: roomCreate
      parameters:
        - in: query
          name: start
          required: false
          schema:
            type: boolean
            default: true
            description: Start room after creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomSettings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomEntry'
        '409':
          description: Deployment name exists or selected profile is already bound
        '404':
          description: Selected profile not found
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/rooms/{roomId}:
    get:
      tags:
        - rooms
      summary: Get room entry
      operationId: roomGet
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomEntry'
        '400':
          description: Bad request
        '404':
          description: Room not found
        '500':
          description: Internal server error
    delete:
      tags:
        - rooms
      summary: Remove room
      operationId: roomRemove
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomName}/by-name:
    get:
      tags:
        - rooms
      summary: Get room entry by name
      operationId: roomGetByName
      parameters:
        - in: path
          name: roomName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomEntry'
        '400':
          description: Bad request
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/clone:
    post:
      tags:
        - rooms
      summary: Clone a room and start the independent copy
      description: |
        Owner-only, same-origin mutation relative to the management prefix
        (for example /manage/api/rooms/{roomId}/clone). Only the new name is
        accepted. Preserves the source configuration and browser identity by
        independently copying managed persistent storage; a running source is
        briefly paused during its snapshot and always resumed. The source's
        original running, paused, or stopped state is retained. Unmanaged
        writable mounts are rejected rather than shared. Agent keys and Owner
        sessions are not copied. Returns after the new room has been started.
      operationId: roomClone
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCloneRequest'
      responses:
        '201':
          description: Independent clone created and started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomEntry'
        '400':
          description: Invalid request or source configuration cannot be cloned independently
        '401':
          description: Owner authentication required
        '403':
          description: Cross-origin request or Agent credentials are not permitted
        '404':
          description: Source room not found
        '409':
          description: Target room name or persistent storage already exists
        '500':
          description: Clone failed; partial target resources are rolled back
  /api/rooms/{roomId}/settings:
    get:
      tags:
        - rooms
      summary: Get room settings
      operationId: roomSettings
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSettings'
        '400':
          description: Bad request
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/stats:
    get:
      tags:
        - rooms
      summary: Get room statistics
      operationId: roomStats
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomStats'
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/stop:
    post:
      tags:
        - rooms
      summary: Stop room
      operationId: roomStop
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/start:
    post:
      tags:
        - rooms
      summary: Start room
      operationId: roomStart
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/restart:
    post:
      tags:
        - rooms
      summary: Restart room
      operationId: roomRestart
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/pause:
    post:
      tags:
        - rooms
      summary: Pause room
      operationId: roomPause
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/recreate:
    post:
      tags:
        - rooms
      summary: Recreate room
      description: |
        Explicitly replaces this room using the manager's current network policy.
        The read-only network_mode in saved settings cannot override that policy.
        Unsupported API versions (including v2 in relay/http mode) are rejected before
        removing the existing container. No rooms are recreated automatically.
      operationId: roomRecreate
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
        - in: query
          name: start
          required: false
          schema:
            type: boolean
            description: |
              Whether the room should be started or stopped after
              recreation, default is the current state of the room.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomSettings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomEntry'
        '400':
          description: Unsupported network/API or native config combination; existing container is not removed.
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/docker-compose.yaml:
    get:
      tags:
        - rooms
      summary: Export room as docker-compose
      operationId: exportAsDockerCompose
      responses:
        '200':
          description: OK
          content:
            application/yaml: {}
        '500':
          description: Internal server error

  /api/pull:
    get:
      tags:
        - default
      summary: Get pull status
      operationId: pullStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullStatus'
        '500':
          description: Internal server error
    post:
      tags:
        - default
      summary: Start new pull
      operationId: pullStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullStart'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullStatus'
        '500':
          description: Internal server error
    delete:
      tags:
        - default
      summary: Stop existing pull in progress
      operationId: pullStop
      responses:
        '204':
          description: OK
        '500':
          description: Internal server error
  /api/pull/sse:
    get:
      tags:
        - default
      summary: Get pull status as SSE
      operationId: pullStatusSSE
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                type: array
                format: event-stream
                items:
                  $ref: '#/components/schemas/PullLayer'
        '500':
          description: Internal server error

components:
  securitySchemes:
    nativeRoomToken:
      type: http
      scheme: bearer
      description: Real native room token, independent of Owner and Agent credentials; WS uses the first JSON auth message instead.
    managerSession:
      type: apiKey
      in: cookie
      name: neko_rooms_admin_session
      description: Opaque owner session issued by native form login; unsafe methods also require same-origin Origin/Referer.
    managerBasicAuth:
      type: http
      scheme: basic
      description: Legacy management authentication, only when admin.auth_mode=basic (never accepted in form mode).
  schemas:
    ManagerAuthStatus:
      type: object
      required: [mode, authenticated, login_url, logout_url]
      properties:
        mode:
          type: string
          enum: [form, basic, proxy, none]
        authenticated:
          type: boolean
        username:
          type: string
          description: Present only for an authenticated local owner.
        login_url:
          type: string
          example: /manage/auth/login
        logout_url:
          type: string
          example: /manage/auth/logout
    AgentKeyCreate:
      type: object
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 3600
        label:
          type: string
          default: ''
    AgentKey:
      type: object
      required: [key_id, room_name, label, created_at, expires_at, active_connections]
      properties:
        key_id:
          type: string
        room_name:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        active_connections:
          type: integer
          minimum: 0
    IssuedAgentKey:
      type: object
      required: [key_id, key, room_name, created_at, expires_at, cdp_url, prompt]
      properties:
        key_id:
          type: string
        key:
          type: string
          description: Raw temporary key, shown only at issuance
        room_name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        cdp_url:
          type: string
        prompt:
          type: string
          description: Canonical handoff text to copy verbatim; clients must not reconstruct it
    RoomsConfig:
      type: object
      properties:
        network_mode:
          type: string
          enum: [direct, relay, http]
          default: direct
          description: Policy for new or explicitly recreated rooms; existing rooms retain their actual mode. No ICE server credentials are returned.
        connections:
          type: number
          example: 100
        neko_images:
          type: array
          items:
            type: string
            example: ghcr.io/m1k1o/neko/firefox:latest
        storage_enabled:
          type: boolean
          example: true
        uses_mux:
          type: boolean
          example: true

    RoomEntry:
      type: object
      properties:
        profile_id:
          type: string
          description: Durable profile binding. On creation choose an available profile, or omit to create a new durable profile automatically.
        profile_name:
          type: string
          description: Profile display name; on creation names a new profile when profile_id is omitted. Defaults to the deployment name.
        id:
          type: string
          example: bc04dace10
        url:
          type: string
          description: Same-origin relative path in HTTP mode; existing URL behavior in direct/relay mode.
          example: /room/foobar/
        name:
          type: string
          example: foobar
        neko_image:
          type: string
          example: ghcr.io/m1k1o/neko/firefox:latest
        network_mode:
          type: string
          enum: [direct, relay, http]
          description: Actual policy recorded on this container; absent legacy metadata is interpreted as direct.
        is_outdated:
          type: boolean
          example: true
        max_connections:
          type: number
          example: 10
          description: 0 when using mux
        running:
          type: boolean
          example: true
        paused:
          type: boolean
          example: false
        is_ready:
          type: boolean
          example: true
        status:
          type: string
          example: Up 2 seconds
        created:
          type: string
          format: datetime
          example: "2021-03-07T21:56:34Z"
        labels:
          type: object
          additionalProperties: 
            type: string

    RoomMount:
      type: object
      properties:
        type:
          type: string
          enum: [ private, template, protected, public ]
          example: private
        host_path:
          type: string
          example: /profile
        container_path:
          type: string
          example: /home/neko/.config/chromium

    RoomResources:
      type: object
      properties:
        cpu_shares:
          type: number
          description: relative weight vs. other containers
        nano_cpus:
          type: number
          description: in units of 10^-9 CPUs
        shm_size:
          type: number
          description: in bytes
          default: 2000000000
        memory:
          type: number
          description: in bytes
        gpus:
          type: array
          items:
            type: string
            example: all
        devices:
          type: array
          items:
            type: string
            example: /dev/dri/renderD128

    RoomCloneRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]+$'
          description: Unique new deployment name. Forks a new independent durable profile; retained profiles with the same name are not replaced.
    BrowserProfile:
      type: object
      required: [id, name, created]
      properties:
        id:
          type: string
          description: Stable profile ID, independent of deployment names and container IDs.
        name:
          type: string
          description: Human-readable profile name.
        created:
          type: string
          format: date-time
        room_id:
          type: string
          description: Bound deployment ID; absent when available.
        room_name:
          type: string
          description: Bound deployment name; stopped deployments still reserve the profile.
    ProfileCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    RoomSettings:
      type: object
      properties:
        profile_id:
          type: string
          description: Durable profile binding. On creation choose an available profile, or omit to create a new durable profile automatically.
        profile_name:
          type: string
          description: Profile display name; on creation names a new profile when profile_id is omitted. Defaults to the deployment name.
        api_version:
          type: number
          description: If not set, version is taken from neko_image. Relay and HTTP networking require version 3.
        network_mode:
          type: string
          enum: [direct, relay, http]
          readOnly: true
          description: Actual mode of the inspected container. Creation and explicit recreation always use the manager's current policy, not this field.
        name:
          type: string
          example: foobar
        neko_image:
          type: string
          example: ghcr.io/m1k1o/neko/firefox:latest
        max_connections:
          type: number
          default: 10
          description: 0 when using mux
        user_pass:
          type: string
          example: neko
        admin_pass:
          type: string
          example: admin
        control_protection:
          type: boolean
          example: true
        implicit_control:
          type: boolean
          example: true
        broadcast_pipeline:
          type: string
        screen:
          type: string
          example: 1920x1080@60
        video_codec:
          type: string
          example: VP8
        video_bitrate:
          type: number
          example: 3072
        video_pipeline:
          type: string
        video_max_fps:
          type: number
          example: 25
        audio_codec:
          type: string
          example: OPUS
        audio_bitrate:
          type: number
          example: 128
        audio_pipeline:
          type: string
        envs:
          type: object
          description: Custom environment. Relay/HTTP modes own WebRTC and legacy network keys; per-room overrides cannot change network policy. Explicit NEKO_CONFIG is rejected in private modes. HTTP mode requires native token sessions and VP8/Opus.
          additionalProperties: 
            type: string
          example:
            CUSTOM_ENV: custom value
        labels:
          type: object
          additionalProperties: 
            type: string
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/RoomMount'
        resources:
          $ref: '#/components/schemas/RoomResources'
        hostname:
          type: string
          example: server.lan
        dns:
          type: array
          items:
            type: string
            example: 1.1.1.1
        browser_policy:
          $ref: '#/components/schemas/BrowserPolicy'

    RoomStats:
      type: object
      properties:
        connections:
          type: number
          example: 3
        host:
          type: string
          example: foobar
        members:
          type: array
          items:
            $ref: '#/components/schemas/RoomMember'
        banned:
          type: object
          additionalProperties: 
            type: string
          example:
            192.168.1.8: session_id
        locked:
          type: object
          additionalProperties: 
            type: string
          example:
            control: session_id
            login: session_id
        server_started_at:
          type: string
          format: datetime
          example: "2021-03-07T21:56:34Z"
        last_admin_left_at:
          type: string
          nullable: true
          format: datetime
          example: null
        last_user_left_at:
          type: string
          nullable: true
          format: datetime
          example: "2021-03-07T21:56:34Z"
        control_protection:
          type: boolean
          example: true
        implicit_control:
          type: boolean
          example: true

    RoomMember:
      type: object
      properties:
        id:
          type: string
          example: foobar
        displayname:
          type: string
          example: Foo Bar
        admin:
          type: boolean
          example: true
        muted:
          type: boolean
          example: false

    BrowserPolicy:
      type: object
      properties:
        type:
          type: string
          enum: [ firefox, chromium ]
        path:
          type: string
          example: /usr/lib/firefox/distribution/policies.json
        content:
          $ref: '#/components/schemas/BrowserPolicyContent'

    BrowserPolicyContent:
      type: object
      properties:
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/BrowserPolicyExtension'
        developer_tools:
          type: boolean
          example: true
        persistent_data:
          type: boolean
          example: false
    
    BrowserPolicyExtension:
      type: object
      properties:
        id:
          type: string
          example: uBlock0@raymondhill.net
        url:
          type: string
          example: https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi

    PullStart:
      type: object
      properties:
        neko_image:
          type: string
          example: ghcr.io/m1k1o/neko/firefox:latest
        registry_user:
          type: string
        registry_pass:
          type: string

    PullLayer:
      type: object
      properties:
        status:
          type: string
          example: ghcr.io/m1k1o/neko/firefox:latest
        progressDetail:
          type: object
          properties:
            current:
              type: number
            total:
              type: number
        progress:
          type: string
        id:
          type: string

    PullStatus:
      type: object
      properties:
        active:
          type: boolean
          example: true
        started:
          type: string
          format: datetime
          example: "2021-03-07T21:56:34Z"
        layers:
          type: array
          items:
            $ref: '#/components/schemas/PullLayer'
        status:
          type: array
          items:
            type: string
        finished:
          type: string
          format: datetime
          example: "2021-03-07T21:56:34Z"
