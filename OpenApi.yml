openapi: 3.0.0
info:
  title: Neko Rooms
  version: 1.0.0
  description: |
    Management paths below are relative to admin.path_prefix (for example /manage).
    Configured local credentials use native HTML form login and an owner session by default:
    NEKO_ROOMS_ADMIN_AUTH_MODE=form (CLI --admin.auth_mode=form), with the existing
    NEKO_ROOMS_ADMIN_USERNAME and NEKO_ROOMS_ADMIN_PASSWORD. Explicit basic mode retains
    legacy HTTP Basic; admin.proxy_auth still takes precedence. With no credentials,
    intentionally unauthenticated management remains available. Partial credentials and
    unknown authentication modes are rejected at startup.

    Form-mode API requests without a valid session return 401, never a Basic challenge
    or login HTML. Unsafe management methods and login/logout require an Origin or
    Referer matching the request's scheme, host AND port; programmatic cookie-jar
    clients must supply Origin. Reverse-proxy HTTPS headers are trusted only with
    NEKO_ROOMS_PROXY=true. Owner sessions expire after seven days or manager restart,
    and cannot authenticate Agent CDP. Agent Bearer keys cannot manage rooms or keys.

    Room networking defaults to direct. NEKO_ROOMS_NETWORK_MODE=relay (CLI
    --network.mode=relay) requires Neko API v3 and operator-configured frontend
    RTCIceServers in NEKO_ROOMS_RELAY_ICE_SERVERS_FRONTEND (CLI
    --relay.ice_servers_frontend). Include authenticated turn: or turns: URLs and
    at least one TURN TCP or TLS listener; plain TURN/TCP is valid for local labs.
    Relay rooms publish no per-room media host ports. TURN relay allocations must
    remain on a private network reachable by the room containers. Internet clients
    connect to the configured fixed TURN listener, not to per-room media ports.
    Neko 3.2.0 requires a relay-only startup adapter to disable automatic public-IP
    discovery: it writes a nonsecret, world-readable native config in the container's
    temporary layer and execs the image's original startup argv. Explicit custom
    NEKO_CONFIG, mounted/inherited native config files, and image CLI overrides of
    managed Neko settings (including --config and WebRTC networking flags) are
    rejected in relay mode rather than silently replaced; direct mode is unchanged.
    Relay rooms default native NEKO_LOG_LEVEL to warn because pinned Neko logs TURN
    credentials at info/debug. An explicit per-room NEKO_LOG_LEVEL overrides this
    default; verbose credential-bearing logs are an operator opt-in.
    Config responses expose only the nonsecret network mode, never TURN credentials.
    Changing policy does not migrate or restart existing rooms: it affects new rooms
    and rooms explicitly recreated afterward. Legacy rooms without mode metadata are direct.
servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/m1k1o/neko-rooms/1.0.0
security:
  - managerSession: []
  - managerBasicAuth: []
tags:
  - name: auth
    description: Public owner login and session endpoints
  - name: config
    description: config endpoints
  - name: rooms
    description: room endpoints
  - name: agent
    description: Temporary per-room Agent access, protected by native management authentication
paths:
  /auth/status:
    get:
      tags: [auth]
      summary: Read the effective management authentication mode and current login status
      operationId: managerAuthStatus
      security: []
      description: Always returns public JSON without a password, session token or Basic challenge.
      responses:
        '200':
          description: Authentication status (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerAuthStatus'
  /auth/login:
    get:
      tags: [auth]
      summary: Display a password-manager-friendly native HTML login form
      operationId: managerLoginForm
      security: []
      parameters:
        - in: query
          name: next
          schema:
            type: string
          description: Optional local manager UI path; unsafe targets fall back to the manager root.
      responses:
        '200':
          description: Standard HTML form with username and current-password autocomplete fields; no JavaScript required.
          content:
            text/html:
              schema:
                type: string
        '303':
          description: Already logged in, redirect to manager root.
    post:
      tags: [auth]
      summary: Sign in using the existing configured owner credentials
      operationId: managerLogin
      security: []
      description: |
        Requires same-origin Origin or Referer. Ignores Authorization, including cached
        Basic credentials. Creates a new opaque server-side session and revokes the
        presented prior session. The host-only cookie is HttpOnly, SameSite=Lax and
        scoped to admin.path_prefix; Secure is enabled only for TLS or trusted proxy HTTPS.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                next:
                  type: string
                  description: Only a canonical local manager UI path, never API/auth or an external URL.
      responses:
        '303':
          description: Session cookie set; redirect to the safe next path or manager root.
        '400':
          description: Invalid or oversized form.
        '401':
          description: Ordinary HTML login error, without echoing the password or issuing a Basic challenge.
        '403':
          description: Missing or foreign Origin/Referer (including a different port on the same host).
        '404':
          description: Form login is not enabled in the current authentication mode.
        '415':
          description: Content-Type must be application/x-www-form-urlencoded.
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the owner session and clear its cookie
      operationId: managerLogout
      security: []
      description: |
        Requires same-origin Origin or Referer. Idempotent for expired or revoked sessions.
        Cached Basic credentials cannot silently restore a form-mode session after logout.
      responses:
        '303':
          description: Session revoked and cookie expired; redirect to the login form.
        '403':
          description: Missing or foreign Origin/Referer.
        '404':
          description: Form login is not enabled in the current authentication mode.
    get:
      tags: [auth]
      summary: GET cannot log out an owner
      operationId: managerLogoutGetRejected
      security: []
      responses:
        '405':
          description: Use POST; the session is unchanged.
  /api/config/rooms:
    get:
      tags:
        - config
      summary: Get rooms config
      description: Nonsecret room-creation policy and capacity. Does not include frontend ICE servers or TURN credentials.
      operationId: roomsConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsConfig'
        '500':
          description: Internal server error
  /api/agent/rooms/{roomName}/keys:
    parameters:
      - in: path
        name: roomName
        required: true
        description: Stable room name, URL-encoded as a single path segment (not container ID)
        schema:
          type: string
    post:
      tags:
        - agent
      summary: Create a temporary Agent key and its canonical handoff prompt
      description: |
        Relative to the management UI base, e.g. /manage/api/agent/rooms/{roomName}/keys.
        The raw key and prompt are returned only at issuance and must not be persisted by the client.
        Manager restart invalidates all temporary keys. No room or management passwords are included.
      operationId: agentKeyCreate
      security:
        - managerSession: []
        - managerBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentKeyCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAgentKey'
        '400':
          description: Invalid TTL or request
        '401':
          description: Management authentication required
        '404':
          description: Room not found
        '500':
          description: Internal server error
    get:
      tags:
        - agent
      summary: List active Agent keys for a room, without raw keys or prompts
      operationId: agentKeysList
      security:
        - managerSession: []
        - managerBasicAuth: []
      responses:
        '200':
          description: Active keys and current connection counts
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentKey'
        '401':
          description: Management authentication required
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/agent/rooms/{roomName}/keys/{keyId}:
    delete:
      tags:
        - agent
      summary: Revoke an Agent key and close its active sessions
      operationId: agentKeyRevoke
      security:
        - managerSession: []
        - managerBasicAuth: []
      parameters:
        - in: path
          name: roomName
          required: true
          description: Stable room name, URL-encoded as a single path segment
          schema:
            type: string
        - in: path
          name: keyId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Key revoked and all of its sessions closed
        '401':
          description: Management authentication required
        '404':
          description: Room or key not found
        '500':
          description: Internal server error
  /api/rooms:
    get:
      tags:
        - rooms
      summary: List all rooms
      operationId: roomsList
      parameters:
        - in: query
          name: labels
          schema:
            type: object
            additionalProperties: 
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomEntry'
        '500':
          description: Internal server error
    post:
      tags:
        - rooms
      summary: Create new room
      description: Unsupported network/API or native-config settings return 400; Docker and operator-configuration failures remain 500.
      operationId: roomCreate
      parameters:
        - in: query
          name: start
          required: false
          schema:
            type: boolean
            default: true
            description: Start room after creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomSettings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomEntry'
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/rooms/{roomId}:
    get:
      tags:
        - rooms
      summary: Get room entry
      operationId: roomGet
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomEntry'
        '400':
          description: Bad request
        '404':
          description: Room not found
        '500':
          description: Internal server error
    delete:
      tags:
        - rooms
      summary: Remove room
      operationId: roomRemove
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomName}/by-name:
    get:
      tags:
        - rooms
      summary: Get room entry by name
      operationId: roomGetByName
      parameters:
        - in: path
          name: roomName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomEntry'
        '400':
          description: Bad request
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/settings:
    get:
      tags:
        - rooms
      summary: Get room settings
      operationId: roomSettings
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSettings'
        '400':
          description: Bad request
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/stats:
    get:
      tags:
        - rooms
      summary: Get room statistics
      operationId: roomStats
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomStats'
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/stop:
    post:
      tags:
        - rooms
      summary: Stop room
      operationId: roomStop
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/start:
    post:
      tags:
        - rooms
      summary: Start room
      operationId: roomStart
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/restart:
    post:
      tags:
        - rooms
      summary: Restart room
      operationId: roomRestart
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/pause:
    post:
      tags:
        - rooms
      summary: Pause room
      operationId: roomPause
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/rooms/{roomId}/recreate:
    post:
      tags:
        - rooms
      summary: Recreate room
      description: |
        Explicitly replaces this room using the manager's current network policy.
        The read-only network_mode in saved settings cannot override that policy.
        Unsupported API versions (including v2 in relay mode) are rejected before
        removing the existing container. No rooms are recreated automatically.
      operationId: roomRecreate
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
        - in: query
          name: start
          required: false
          schema:
            type: boolean
            description: |
              Whether the room should be started or stopped after
              recreation, default is the current state of the room.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomSettings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomEntry'
        '400':
          description: Unsupported network/API or native config combination; existing container is not removed.
        '404':
          description: Room not found
        '500':
          description: Internal server error
  /api/docker-compose.yaml:
    get:
      tags:
        - rooms
      summary: Export room as docker-compose
      operationId: exportAsDockerCompose
      responses:
        '200':
          description: OK
          content:
            application/yaml: {}
        '500':
          description: Internal server error

  /api/pull:
    get:
      tags:
        - default
      summary: Get pull status
      operationId: pullStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullStatus'
        '500':
          description: Internal server error
    post:
      tags:
        - default
      summary: Start new pull
      operationId: pullStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullStart'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullStatus'
        '500':
          description: Internal server error
    delete:
      tags:
        - default
      summary: Stop existing pull in progress
      operationId: pullStop
      responses:
        '204':
          description: OK
        '500':
          description: Internal server error
  /api/pull/sse:
    get:
      tags:
        - default
      summary: Get pull status as SSE
      operationId: pullStatusSSE
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                type: array
                format: event-stream
                items:
                  $ref: '#/components/schemas/PullLayer'
        '500':
          description: Internal server error

components:
  securitySchemes:
    managerSession:
      type: apiKey
      in: cookie
      name: neko_rooms_admin_session
      description: Opaque owner session issued by native form login; unsafe methods also require same-origin Origin/Referer.
    managerBasicAuth:
      type: http
      scheme: basic
      description: Legacy management authentication, only when admin.auth_mode=basic (never accepted in form mode).
  schemas:
    ManagerAuthStatus:
      type: object
      required: [mode, authenticated, login_url, logout_url]
      properties:
        mode:
          type: string
          enum: [form, basic, proxy, none]
        authenticated:
          type: boolean
        username:
          type: string
          description: Present only for an authenticated local owner.
        login_url:
          type: string
          example: /manage/auth/login
        logout_url:
          type: string
          example: /manage/auth/logout
    AgentKeyCreate:
      type: object
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 3600
        label:
          type: string
          default: ''
    AgentKey:
      type: object
      required: [key_id, room_name, label, created_at, expires_at, active_connections]
      properties:
        key_id:
          type: string
        room_name:
          type: string
        label:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        active_connections:
          type: integer
          minimum: 0
    IssuedAgentKey:
      type: object
      required: [key_id, key, room_name, created_at, expires_at, cdp_url, prompt]
      properties:
        key_id:
          type: string
        key:
          type: string
          description: Raw temporary key, shown only at issuance
        room_name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        cdp_url:
          type: string
        prompt:
          type: string
          description: Canonical handoff text to copy verbatim; clients must not reconstruct it
    RoomsConfig:
      type: object
      properties:
        network_mode:
          type: string
          enum: [direct, relay]
          default: direct
          description: Policy for new or explicitly recreated rooms; existing rooms retain their actual mode. No ICE server credentials are returned.
        connections:
          type: number
          example: 100
        neko_images:
          type: array
          items:
            type: string
            example: ghcr.io/m1k1o/neko/firefox:latest
        storage_enabled:
          type: boolean
          example: true
        uses_mux:
          type: boolean
          example: true

    RoomEntry:
      type: object
      properties:
        id:
          type: string
          example: bc04dace10
        url:
          type: string
          example: http://neko-rooms.server.lan/foobar/
        name:
          type: string
          example: foobar
        neko_image:
          type: string
          example: ghcr.io/m1k1o/neko/firefox:latest
        network_mode:
          type: string
          enum: [direct, relay]
          description: Actual policy recorded on this container; absent legacy metadata is interpreted as direct.
        is_outdated:
          type: boolean
          example: true
        max_connections:
          type: number
          example: 10
          description: 0 when using mux
        running:
          type: boolean
          example: true
        paused:
          type: boolean
          example: false
        is_ready:
          type: boolean
          example: true
        status:
          type: string
          example: Up 2 seconds
        created:
          type: string
          format: datetime
          example: "2021-03-07T21:56:34Z"
        labels:
          type: object
          additionalProperties: 
            type: string

    RoomMount:
      type: object
      properties:
        type:
          type: string
          enum: [ private, template, protected, public ]
          example: private
        host_path:
          type: string
          example: /profile
        container_path:
          type: string
          example: /home/neko/.config/chromium

    RoomResources:
      type: object
      properties:
        cpu_shares:
          type: number
          description: relative weight vs. other containers
        nano_cpus:
          type: number
          description: in units of 10^-9 CPUs
        shm_size:
          type: number
          description: in bytes
          default: 2000000000
        memory:
          type: number
          description: in bytes
        gpus:
          type: array
          items:
            type: string
            example: all
        devices:
          type: array
          items:
            type: string
            example: /dev/dri/renderD128

    RoomSettings:
      type: object
      properties:
        api_version:
          type: number
          description: If not set, version is taken from neko_image. Relay networking requires version 3.
        network_mode:
          type: string
          enum: [direct, relay]
          readOnly: true
          description: Actual mode of the inspected container. Creation and explicit recreation always use the manager's current policy, not this field.
        name:
          type: string
          example: foobar
        neko_image:
          type: string
          example: ghcr.io/m1k1o/neko/firefox:latest
        max_connections:
          type: number
          default: 10
          description: 0 when using mux
        user_pass:
          type: string
          example: neko
        admin_pass:
          type: string
          example: admin
        control_protection:
          type: boolean
          example: true
        implicit_control:
          type: boolean
          example: true
        broadcast_pipeline:
          type: string
        screen:
          type: string
          example: 1920x1080@60
        video_codec:
          type: string
          example: VP8
        video_bitrate:
          type: number
          example: 3072
        video_pipeline:
          type: string
        video_max_fps:
          type: number
          example: 25
        audio_codec:
          type: string
          example: OPUS
        audio_bitrate:
          type: number
          example: 128
        audio_pipeline:
          type: string
        envs:
          type: object
          description: Custom environment. Relay mode owns WebRTC and legacy network keys; per-room overrides cannot change the network policy or frontend TURN configuration. Explicit NEKO_CONFIG is rejected in relay mode.
          additionalProperties: 
            type: string
          example:
            CUSTOM_ENV: custom value
        labels:
          type: object
          additionalProperties: 
            type: string
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/RoomMount'
        resources:
          $ref: '#/components/schemas/RoomResources'
        hostname:
          type: string
          example: server.lan
        dns:
          type: array
          items:
            type: string
            example: 1.1.1.1
        browser_policy:
          $ref: '#/components/schemas/BrowserPolicy'

    RoomStats:
      type: object
      properties:
        connections:
          type: number
          example: 3
        host:
          type: string
          example: foobar
        members:
          type: array
          items:
            $ref: '#/components/schemas/RoomMember'
        banned:
          type: object
          additionalProperties: 
            type: string
          example:
            192.168.1.8: session_id
        locked:
          type: object
          additionalProperties: 
            type: string
          example:
            control: session_id
            login: session_id
        server_started_at:
          type: string
          format: datetime
          example: "2021-03-07T21:56:34Z"
        last_admin_left_at:
          type: string
          nullable: true
          format: datetime
          example: null
        last_user_left_at:
          type: string
          nullable: true
          format: datetime
          example: "2021-03-07T21:56:34Z"
        control_protection:
          type: boolean
          example: true
        implicit_control:
          type: boolean
          example: true

    RoomMember:
      type: object
      properties:
        id:
          type: string
          example: foobar
        displayname:
          type: string
          example: Foo Bar
        admin:
          type: boolean
          example: true
        muted:
          type: boolean
          example: false

    BrowserPolicy:
      type: object
      properties:
        type:
          type: string
          enum: [ firefox, chromium ]
        path:
          type: string
          example: /usr/lib/firefox/distribution/policies.json
        content:
          $ref: '#/components/schemas/BrowserPolicyContent'

    BrowserPolicyContent:
      type: object
      properties:
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/BrowserPolicyExtension'
        developer_tools:
          type: boolean
          example: true
        persistent_data:
          type: boolean
          example: false
    
    BrowserPolicyExtension:
      type: object
      properties:
        id:
          type: string
          example: uBlock0@raymondhill.net
        url:
          type: string
          example: https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi

    PullStart:
      type: object
      properties:
        neko_image:
          type: string
          example: ghcr.io/m1k1o/neko/firefox:latest
        registry_user:
          type: string
        registry_pass:
          type: string

    PullLayer:
      type: object
      properties:
        status:
          type: string
          example: ghcr.io/m1k1o/neko/firefox:latest
        progressDetail:
          type: object
          properties:
            current:
              type: number
            total:
              type: number
        progress:
          type: string
        id:
          type: string

    PullStatus:
      type: object
      properties:
        active:
          type: boolean
          example: true
        started:
          type: string
          format: datetime
          example: "2021-03-07T21:56:34Z"
        layers:
          type: array
          items:
            $ref: '#/components/schemas/PullLayer'
        status:
          type: array
          items:
            type: string
        finished:
          type: string
          format: datetime
          example: "2021-03-07T21:56:34Z"
