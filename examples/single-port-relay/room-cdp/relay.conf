; Private Docker-network relay to CDP on the SAME native headed Chromium.
; Keep Host and Origin bytes unchanged: Chromium still performs its own checks.
[program:cdp-relay]
command=/usr/bin/socat TCP4-LISTEN:9223,bind=0.0.0.0,reuseaddr,fork TCP4:127.0.0.1:9222
user=neko
autorestart=true
priority=810
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/neko/cdp-relay.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
